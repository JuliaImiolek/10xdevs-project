# Pull Request workflow: lint → unit tests (with coverage) → status comment on PR
# status-comment runs only when lint and unit-test succeed
name: Pull Request

on:
  pull_request:
    branches: [master]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup (checkout, Node, npm ci)
        uses: ./.github/actions/setup-node
        with:
          node-version-file: .nvmrc

      - name: Lint
        run: npm run lint

  unit-test:
    name: Unit tests
    runs-on: ubuntu-latest
    outputs:
      pct: ${{ steps.coverage_summary.outputs.pct }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup (checkout, Node, npm ci)
        uses: ./.github/actions/setup-node
        with:
          node-version-file: .nvmrc

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Coverage summary
        id: coverage_summary
        run: |
          COVERAGE_PCT=$(node .github/scripts/coverage-summary.mjs)
          echo "pct=$COVERAGE_PCT" >> "$GITHUB_OUTPUT"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  status-comment:
    name: Status comment
    runs-on: ubuntu-latest
    needs: [lint, unit-test]
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Comment PR status
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- pr-status-comment -->';
            const coveragePct = '${{ needs.unit-test.outputs.pct }}' || '—';
            const body = `## ✅ PR checks passed
            ${marker}

            | Check | Status |
            |-------|--------|
            | Lint | ✅ Passed |
            | Unit tests | ✅ Passed |
            | Coverage (statements) | ${coveragePct}% |

            Coverage report is available in the workflow artifacts.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
        if: github.event_name == 'pull_request'
