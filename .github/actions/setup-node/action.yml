# Composite action: setup Node (from .nvmrc) + npm ci
# Requires checkout to be run first (needed for local actions to resolve).
description: "Setup Node from .nvmrc, install dependencies with npm ci"
inputs:
  node-version-file:
    description: "Path to Node version file (e.g. .nvmrc)"
    required: false
    default: ".nvmrc"
runs:
  using: "composite"
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version-file: ${{ inputs.node-version-file }}
        cache: "npm"

    - name: Install dependencies
      run: npm ci
      shell: bash
